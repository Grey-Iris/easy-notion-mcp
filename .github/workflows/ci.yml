name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Security audit
        if: matrix.node-version == 20
        run: |
          # Known non-exploitable advisories — each grounded in actual code-path analysis.
          # Full writeup with file:line evidence and cross-model (Codex) confirmation:
          #   .meta/audits/dep-vuln-exploitability-2026-06-14.md
          #
          # Our HTTP layer is Express (src/http.ts:99-100), NOT hono. The hono framework
          # is never executed: grep -rn hono src/ = 0 hits; only the @hono/node-server
          # adapter (Node built-ins only) is on the live path. No patched versions exist
          # yet, so there is nothing to bump. Remove each entry when a patch lands.
          #
          # hono / @hono/node-server / @modelcontextprotocol/sdk (hono carriers):
          #   GHSA-xrhx-7g5j-rcj5 (ipRestriction IPv6 bypass) — no hono routing/IP rules.
          #   GHSA-3hrh-pfw6-9m5x (cookie helper injection)    — no hono cookies; bearer auth.
          #   GHSA-f577-qrjj-4474 (JWT middleware any-scheme)  — we enforce Bearer (src/http.ts:71).
          #   GHSA-2gcr-mfcq-wcc3 (app.mount undecoded prefix) — no hono app; Express routes.
          # qs / body-parser / express (qs carriers):
          #   GHSA-q8mj-m7cp-5q26 (qs.stringify DoS) — qs.stringify never called; only
          #   express.json() mounted (urlencoded path inactive); Express uses qs.parse.
          KNOWN_ALLOWLIST="hono @hono/node-server @modelcontextprotocol/sdk qs body-parser express"
          AUDIT=$(npm audit --omit=dev --json 2>/dev/null) || true
          VULN_KEYS=$(echo "$AUDIT" | jq -r '.vulnerabilities | keys[]' 2>/dev/null)
          if [ -z "$VULN_KEYS" ]; then
            echo "No vulnerabilities found"
          else
            UNKNOWN=""
            for key in $VULN_KEYS; do
              if ! echo "$KNOWN_ALLOWLIST" | grep -qw "$key"; then
                UNKNOWN="$UNKNOWN $key"
              fi
            done
            if [ -z "$UNKNOWN" ]; then
              echo "::warning::Only known non-exploitable advisories present — skipping"
            else
              echo "Unknown vulnerabilities found:$UNKNOWN"
              echo "$AUDIT" | jq .
              exit 1
            fi
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
          # path-to-regexp ReDoS — not exploitable (static routes only).
          # Remove once express pulls in path-to-regexp >=8.4.0
          #
          # hono + qs advisories — assessed not exploitable; hono framework is never
          # executed (Express is our HTTP layer) and qs.stringify is never called.
          # Grounded per-advisory writeup: .meta/audits/dep-vuln-exploitability-2026-06-14.md
          allow-ghsas: GHSA-j3q9-mxjg-w52f, GHSA-27v5-c462-wpq7, GHSA-xrhx-7g5j-rcj5, GHSA-3hrh-pfw6-9m5x, GHSA-f577-qrjj-4474, GHSA-2gcr-mfcq-wcc3, GHSA-q8mj-m7cp-5q26
